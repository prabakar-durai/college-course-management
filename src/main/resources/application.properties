spring.datasource.url=jdbc:h2:file:./data/college-course-db
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.application.name=college-course-management

logging.level.com.prabakar.collegecourse=DEBUG
logging.file.name=logs/college-course-management.log

logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7